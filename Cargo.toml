[package]
name = "kokkai-mirror"
version = "0.1.0"
edition = "2021"
description = "Mirrors the Japanese Diet record API of the National Diet Library"
license = "MIT"
publish = false

[[bin]]
name = "kokkai-mirror"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = "2"
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
